<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Products Manager</h1>
    <p>A frontend for my Express REST API</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add a product</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <label>Name <input type="text" id="name" required /></label>
        <label>Price <input type="number" id="price" min="0" step="0.01" required /></label>
        <label>Category <input type="text" id="category" /></label>
        <div class="buttons">
          <button type="submit" id="submit-btn">Add product</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section>
      <h2>All products</h2>
      <div id="products" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
